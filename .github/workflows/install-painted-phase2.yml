name: Install painted Phase 2 assets

on:
  push:
    branches:
      - phase2-painted-final
    paths:
      - .phase2-painted/payload.tar.gz
      - .github/workflows/install-painted-phase2.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase2-painted-final
          fetch-depth: 0

      - name: Extract painted assets
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .phase2-painted/payload.tar.gz
          test -s masters/farm/soil/soil_empty_v01.png
          test -s runtime/1x/farm/crops/core_crops_v01.png
          test "$(find masters/farm/crops -type f -name '*_v01.png' | wc -l)" -eq 15
          rm -f scripts/generate_phase2_core_crops.py
          rm -f .github/workflows/generate-phase2-core-crops.yml
          rm -rf .phase2-painted
          rm -f .github/workflows/install-painted-phase2.yml

      - name: Commit painted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: replace Phase 2 with painted crop art [skip ci]"
          git push origin HEAD:phase2-painted-final
